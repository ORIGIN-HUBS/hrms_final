# Development Profile Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# Development Database (Local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/hrms_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Development Logging
logging.level.com.originhubs.HRMS=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Development File Upload
file.upload-dir=./uploads

# Development JWT (shorter expiration for testing)
jwt.expiration=3600000