<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password Error - HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }
        .error-header {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .error-body {
            padding: 2rem;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-header">
            <h4 class="mb-0">
                <i class="bi bi-exclamation-triangle"></i><br>
                Reset Link Invalid
            </h4>
        </div>
        <div class="error-body">
            <div class="alert alert-danger" role="alert">
                <i class="bi bi-x-circle"></i>
                <span th:text="${error ?: 'The password reset link is invalid or has expired.'}"></span>
            </div>

            <p class="text-muted mb-4">
                This could happen because:
            </p>
            <ul class="text-start text-muted mb-4">
                <li>The link has expired (links are valid for 24 hours)</li>
                <li>The link has already been used</li>
                <li>The link is malformed or incomplete</li>
            </ul>

            <div class="d-grid gap-2">
                <a href="/auth/forgot-password" class="btn btn-primary">
                    <i class="bi bi-envelope"></i> Request New Reset Link
                </a>
                <a href="/login" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
