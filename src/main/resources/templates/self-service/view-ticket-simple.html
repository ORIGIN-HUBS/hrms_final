<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details - HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3>Ticket Details</h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Ticket Number:</h5>
                                <p th:text="${ticket.ticketNumber}">TKT-001</p>
                                
                                <h5>Subject:</h5>
                                <p th:text="${ticket.subject}">Ticket Subject</p>
                                
                                <h5>Description:</h5>
                                <p th:text="${ticket.description}">Ticket Description</p>
                                
                                <h5>Category:</h5>
                                <p th:text="${ticket.category.displayName}">Category</p>
                            </div>
                            <div class="col-md-6">
                                <h5>Status:</h5>
                                <p th:text="${ticket.status.displayName}">Status</p>
                                
                                <h5>Priority:</h5>
                                <p th:text="${ticket.priority.displayName}">Priority</p>
                                
                                <h5>Created:</h5>
                                <p th:text="${ticket.createdAt}">Date</p>
                                
                                <h5>Employee:</h5>
                                <p th:text="${ticket.employee.firstName + ' ' + ticket.employee.lastName}">Employee Name</p>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <!-- Back button for Admin/HR users -->
                            <a th:if="${isAdminOrHR}" href="/self-service/admin/tickets" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to Admin Dashboard
                            </a>
                            <!-- Back button for Employee users -->
                            <a th:unless="${isAdminOrHR}" href="/self-service" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to Self Service Portal
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
