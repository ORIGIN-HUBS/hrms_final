<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>Debug Authentication Status</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${message}">
                            <div class="alert alert-warning" th:text="${message}"></div>
                        </div>
                        
                        <div th:if="${username}">
                            <h5>Authentication Details:</h5>
                            <ul class="list-group">
                                <li class="list-group-item">
                                    <strong>Username:</strong> <span th:text="${username}"></span>
                                </li>
                                <li class="list-group-item">
                                    <strong>Authenticated:</strong> <span th:text="${authenticated}"></span>
                                </li>
                                <li class="list-group-item">
                                    <strong>Authorities/Roles:</strong>
                                    <ul>
                                        <li th:each="authority : ${authorities}" th:text="${authority.authority}"></li>
                                    </ul>
                                </li>
                            </ul>
                            
                            <div class="mt-4">
                                <h6>Test Links:</h6>
                                <a href="/self-service/admin/tickets" class="btn btn-primary me-2">Test Admin Tickets</a>
                                <a href="/dashboard" class="btn btn-secondary me-2">Back to Dashboard</a>
                                <a href="/self-service" class="btn btn-info">Self Service Portal</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
