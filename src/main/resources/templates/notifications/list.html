<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #0d6efd;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding-top: 20px;
            z-index: 1000;
        }

        .sidebar .brand {
            padding: 15px 25px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            display: block;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 25px;
            margin: 5px 0;
            border-radius: 0;
            transition: all 0.3s;
        }

        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 0;
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        .navbar-custom {
            background: white;
            box-shadow: 0 2px 4px rgba(0,0,0,.08);
            border-bottom: 1px solid #e9ecef;
            padding: 1rem 2rem;
        }

        .notification-item {
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }

        .notification-item.unread {
            border-left-color: var(--primary-color);
            background-color: #f8f9ff;
        }

        .notification-item:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/dashboard" class="brand">
            <i class="bi bi-buildings"></i> HRMS
        </a>
        <nav class="nav flex-column mt-4">
            <a class="nav-link" href="/dashboard">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <div sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" href="/users">
                    <i class="bi bi-person-gear"></i> Users
                </a>
            </div>
            <div sec:authorize="hasAnyRole('ADMIN', 'HR')">
                <a class="nav-link" href="/employee/list">
                    <i class="bi bi-people"></i> Employees
                </a>
                <a class="nav-link" href="/project/list">
                    <i class="bi bi-briefcase"></i> Projects
                </a>
                <a class="nav-link" href="/offboarding/list">
                    <i class="bi bi-box-arrow-right"></i> Offboarding
                </a>
            </div>
            <div sec:authorize="hasRole('EMPLOYEE')">
                <a class="nav-link" href="/employee/profile">
                    <i class="bi bi-person"></i> My Profile
                </a>
                <a class="nav-link" href="/employee/documents/upload">
                    <i class="bi bi-file-earmark-arrow-up"></i> Upload Documents
                </a>
            </div>
            <a class="nav-link active" href="/notifications">
                <i class="bi bi-bell"></i> Notifications
            </a>
        </nav>
    </div>

    <div class="main-content">
        <nav class="navbar navbar-custom">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">
                    <i class="bi bi-bell"></i> Notifications
                </span>
                <div class="d-flex align-items-center">
                    <span class="me-3" sec:authentication="name">User</span>
                    <span class="badge bg-primary me-3" sec:authorize="hasRole('ADMIN')">Admin</span>
                    <span class="badge bg-info me-3" sec:authorize="hasRole('HR')">HR</span>
                    <span class="badge bg-success me-3" sec:authorize="hasRole('EMPLOYEE')">Employee</span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </form>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4>All Notifications</h4>
                        <button type="button" class="btn btn-outline-primary" onclick="markAllAsRead()">
                            <i class="bi bi-check-all"></i> Mark All as Read
                        </button>
                    </div>

                    <div th:if="${notifications != null and !notifications.isEmpty()}">
                        <div th:each="notification : ${notifications}" 
                             class="card notification-item mb-3" 
                             th:classappend="${!notification.isRead ? 'unread' : ''}">
                            <div class="card-body">
                                <div class="d-flex align-items-start">
                                    <div class="me-3">
                                        <i class="fs-4" th:class="${notification.typeIcon + ' text-' + (notification.type == 'SUCCESS' ? 'success' : (notification.type == 'WARNING' ? 'warning' : (notification.type == 'ERROR' ? 'danger' : 'info')))}"></i>
                                    </div>
                                    <div class="flex-grow-1">
                                        <h6 class="fw-bold mb-1" th:text="${notification.title}">Notification Title</h6>
                                        <p class="mb-2" th:text="${notification.message}">Notification message content</p>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <small class="text-muted">
                                                <i class="bi bi-clock"></i> 
                                                <span th:text="${#temporals.format(notification.createdAt, 'MMM dd, yyyy HH:mm')}">Oct 27, 2025 10:30</span>
                                            </small>
                                            <div>
                                                <span class="badge" th:class="${notification.typeClass}" th:text="${notification.category}">DOCUMENT</span>
                                                <button th:if="${!notification.isRead}" 
                                                        type="button" 
                                                        class="btn btn-sm btn-outline-primary ms-2"
                                                        th:onclick="'markAsRead(' + ${notification.id} + ')'">
                                                    Mark as Read
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${notifications == null or notifications.isEmpty()}" class="text-center py-5">
                        <i class="bi bi-bell-slash display-1 text-muted"></i>
                        <h4 class="mt-3 text-muted">No Notifications</h4>
                        <p class="text-muted">You're all caught up! No new notifications.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function markAsRead(notificationId) {
            fetch(`/notifications/${notificationId}/mark-read`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function markAllAsRead() {
            fetch('/notifications/mark-all-read', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
